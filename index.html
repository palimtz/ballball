<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ballball - Clone Reconstitution</title>
  </head>
  <body>
    <div id="app">
      <header class="top-header">
        <div class="brand-badge">
          <span class="dot"></span>
          ballball
        </div>
        <div class="format-selector" role="group" aria-label="Format de match">
          <button class="format-btn active" data-format="1">1v1</button>
          <button class="format-btn" data-format="2">2v2</button>
          <button class="format-btn" data-format="3">3v3</button>
          <button class="format-btn" data-format="4">4v4</button>
          <button class="format-btn" data-format="5">5v5</button>
        </div>
        <div class="header-actions">
          <button id="btn-camera" class="action-btn" title="Changer de caméra (Touche C)">Caméra : ⚽ Ballon</button>
          <button id="btn-pause" class="action-btn" title="Mettre en pause (Échap ou P)">Pause ⏸</button>
          <button id="btn-restart" class="action-btn">Recommencer</button>
        </div>
      </header>
      <button id="btn-skip-replay" class="skip-replay-btn" hidden>Passer le ralenti (V ou Espace)</button>
      <div id="pause-modal" class="pause-overlay" hidden>
        <div class="pause-card">
          <h2>MATCH EN PAUSE</h2>
          <p>La partie est temporairement suspendue</p>
          <div class="pause-actions">
            <button id="btn-resume" class="btn-primary">Reprendre (Échap)</button>
            <button id="btn-restart-pause" class="btn-secondary">Recommencer la partie</button>
          </div>
        </div>
      </div>
      <canvas id="court"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
